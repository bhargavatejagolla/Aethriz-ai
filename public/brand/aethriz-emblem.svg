<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Red Bio-Gradient -->
    <linearGradient id="aethrizRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Dark Charcoal Bio-Gradient -->
    <linearGradient id="aethrizDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="aethrizEmblemShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#DC2626" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Outer White Badge -->
  <circle cx="50" cy="50" r="45" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2" />
  <circle cx="50" cy="50" r="43" fill="none" stroke="rgba(220, 38, 38, 0.12)" stroke-width="1" />

  <!-- 3D Monogram Emblem Group -->
  <g filter="url(#aethrizEmblemShadow)">
    <!-- Top Apex Arch (Obsidian Black) -->
    <path 
      d="M 37 46 L 47 23 C 48.2 20.5 51.8 20.5 53 23 L 63 46 L 56 46 L 50 31 L 44 46 Z" 
      fill="url(#aethrizDarkGrad)" 
    />
    <!-- 3D Top Inner Bevel -->
    <path 
      d="M 50 21 L 53 23 L 47 23 Z" 
      fill="#64748B" 
      opacity="0.8" 
    />

    <!-- Red Crossbar -->
    <path 
      d="M 32 54 L 68 54 L 64 46 L 36 46 Z" 
      fill="url(#aethrizRedGrad)" 
    />

    <!-- Left Leg (Bio-Crimson 3D Ribbon) -->
    <path 
      d="M 23 76 L 36 76 L 47 52 L 34 52 Z" 
      fill="url(#aethrizRedGrad)" 
    />
    <!-- Left Leg 3D Shadow Facet -->
    <path 
      d="M 23 76 L 28 76 L 38 54 L 34 52 Z" 
      fill="#991B1B" 
      opacity="0.5" 
    />

    <!-- Right Leg (Bio-Crimson 3D Ribbon) -->
    <path 
      d="M 64 76 L 77 76 L 66 52 L 53 52 Z" 
      fill="url(#aethrizRedGrad)" 
    />
    <!-- Right Leg 3D Highlight Facet -->
    <path 
      d="M 72 76 L 77 76 L 66 52 L 62 52 Z" 
      fill="#F87171" 
      opacity="0.6" 
    />
  </g>
</svg>
